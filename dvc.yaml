stages:
  validate:
    cmd: python -m ml_dice_game.pipeline validate
    deps:
      - data/raw/dataset2.csv
      - ml_dice_game/dataset.py
      - ml_dice_game/pipeline.py
    outs:
      - data/interim/validation_report.json

  split:
    cmd: python -m ml_dice_game.pipeline split
    deps:
      - data/raw/dataset2.csv
      - ml_dice_game/features.py
      - ml_dice_game/pipeline.py
    params:
      - random_state
      - split
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python -m ml_dice_game.pipeline train
    deps:
      - data/processed/train.csv
      - ml_dice_game/modeling/common.py
      - ml_dice_game/modeling/train_model.py
      - ml_dice_game/modeling/train_random_forest.py
      - ml_dice_game/modeling/train_xgboost.py
      - ml_dice_game/modeling/select_best_model.py
      - ml_dice_game/modeling/tracking.py
      - ml_dice_game/pipeline.py
    params:
      - random_state
      - split
      - train
      - mlflow
    outs:
      - models/base/randomforest.pkl
      - models/base/xgboost.pkl
      - reports/figures/oof
      - reports/metrics/cv.json
      - reports/metrics/selected_model.json

  tune:
    cmd: python -m ml_dice_game.pipeline tune
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - reports/metrics/selected_model.json
      - ml_dice_game/modeling/tune_best_model.py
      - ml_dice_game/modeling/evaluate_test.py
      - ml_dice_game/modeling/tracking.py
      - ml_dice_game/pipeline.py
    params:
      - random_state
      - split
      - tune
      - mlflow
    outs:
      - models/final/model.pkl
      - models/final/features.json
      - reports/figures/test
      - reports/metrics/test.json

  explain:
    cmd: python -m ml_dice_game.pipeline explain
    deps:
      - data/processed/test.csv
      - models/final/model.pkl
      - ml_dice_game/explain.py
      - ml_dice_game/pipeline.py
    outs:
      - reports/figures/shap