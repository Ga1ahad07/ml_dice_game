[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ml_dice_game"
version = "0.0.1"
description = "Modelo de regresi\u00f3n no lineal para estimar el valor de utilidad de una carta de un juego de mesa en proceso de desarrollo."
authors = [
  { name = "Garcia Andrade Alex Rafael" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["ml_dice_game"]
include = ["pyproject.toml", "ml_dice_game/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ml_dice_game"]
force-sort-within-sections = true

